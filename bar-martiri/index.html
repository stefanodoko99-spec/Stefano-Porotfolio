<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Stefano Doko — Bar Martiri</title>
    <meta name="description" content="Stefano Doko, web designer and developer. One pair of hands takes a project from the first sketch to the last commit. Design and build, end to end." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23000%27/%3E%3Cpath d=%27M6 14h20a10 10 0 0 1-20 0z%27 fill=%27%2328e7ff%27/%3E%3Cpath d=%27M9 12 21 3M13 12 25 4%27 stroke=%27%23ff2f9c%27 stroke-width=%272.5%27 stroke-linecap=%27round%27/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="loader" class="loader" aria-live="polite">
      <p class="loader-count" id="loader-count">0</p>
      <div class="loader-bar" id="loader-bar" aria-hidden="true"></div>
      <p class="loader-note" id="loader-note">Loading the shop</p>
      <button id="loader-start" class="loader-start" type="button" hidden>START</button>
    </div>

    <div id="hud" class="hud" hidden>
      <p class="hud-name" id="hud-name"></p>
      <button id="hud-back" class="hud-back" type="button" hidden>← back</button>
      <nav class="hud-links" id="hud-links" aria-label="Sections"></nav>
      <p class="hud-hint" id="hud-hint"></p>
    </div>

    <section class="sr-only" id="sr-content" aria-label="Portfolio text">
      <h1 id="sr-name"></h1>
      <div id="sr-body"></div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
